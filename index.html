<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros Momentos ❤️ Conexión de Novios</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --palo-rosa: #b5838d;
      --palo-rosa-light: #e5989b;
      --palo-rosa-pale: #ffb5a7;
      --palo-rosa-dark: #8c5a65;
      --cream-bg: #fdfbfb;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-muted: #7d6f73;
      --border-color: #f0e6e8;
      --shadow: 0 10px 30px rgba(181, 131, 141, 0.12);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--cream-bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes floatEnvelope {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.03); }
      100% { transform: translateY(0px) scale(1); }
    }

    @keyframes pulseHeart {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .browser-frame {
      max-width: 1050px;
      margin: 30px auto;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(181, 131, 141, 0.2);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .browser-toolbar {
      background: #f7f1f2;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .browser-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e5989b;
      opacity: 0.6;
    }
    .dot:nth-child(1) { background: #ffb5a7; }
    .dot:nth-child(2) { background: #b5838d; }
    .dot:nth-child(3) { background: #6d597a; }

    .hero-section {
      position: relative;
      background: linear-gradient(135deg, rgba(181, 131, 141, 0.85), rgba(229, 152, 155, 0.85)), url('https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 90px 20px;
      overflow: hidden;
    }

    .hero-section::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to top, var(--card-bg), transparent);
    }

    .hero-brand {
      position: absolute;
      top: 20px;
      left: 25px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      margin: 0;
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .hero-content p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.25rem;
      margin: 12px 0 25px 0;
      opacity: 0.95;
    }

    .hero-badge {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(5px);
    }

    .content-container {
      padding: 40px;
      background: var(--cream-bg);
    }

    .login-container {
      max-width: 400px;
      margin: 60px auto;
      background: var(--card-bg);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .login-container h2 {
      font-family: 'Playfair Display', serif;
      color: var(--palo-rosa-dark);
      margin-top: 0;
      font-size: 2rem;
    }

    .login-container p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .user-banner {
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .logout-btn {
      background: transparent;
      color: var(--palo-rosa);
      border: 1px solid var(--palo-rosa);
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .logout-btn:hover {
      background: var(--palo-rosa);
      color: white;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 35px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-muted);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .tab-btn:hover {
      border-color: var(--palo-rosa-light);
      color: var(--palo-rosa-dark);
    }

    .tab-btn.active {
      background: var(--palo-rosa);
      color: white;
      border-color: var(--palo-rosa);
      box-shadow: 0 4px 15px rgba(181, 131, 141, 0.3);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .wishlist-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .wishlist-item:hover {
      transform: translateY(-4px);
      border-color: var(--palo-rosa-light);
      box-shadow: 0 15px 35px rgba(181, 131, 141, 0.18);
    }

    button.action-btn {
      background: var(--palo-rosa);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 14px;
      box-shadow: 0 4px 15px rgba(181, 131, 141, 0.3);
    }

    button.action-btn:hover {
      background: var(--palo-rosa-dark);
    }

    button.secondary-btn {
      background: #fcf6f7;
      color: var(--palo-rosa-dark);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 8px;
    }

    button.secondary-btn:hover {
      background: #f4e8eb;
    }

    .delete-btn {
      background: transparent !important;
      color: #d90429 !important;
      border: 1px solid #ffccd5 !important;
      box-shadow: none !important;
    }

    .delete-btn:hover {
      background: #fff0f3 !important;
      border-color: #d90429 !important;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      margin: 10px 0 20px 0;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      background: #fcfafb;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--palo-rosa);
      background: white;
      box-shadow: 0 0 0 3px rgba(181, 131, 141, 0.12);
    }

    label {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .error-msg {
      color: #d90429;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      flex: 1;
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .stat-card h4 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--palo-rosa);
    }

    .stat-card span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      background: #f4e8eb;
      color: var(--palo-rosa-dark);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-block;
      margin-bottom: 10px;
    }

    /* Envelope Notification Styles */
    .envelope-card {
      background: linear-gradient(135deg, #fff0f3, #ffe5ec);
      border: 2px dashed var(--palo-rosa);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(181, 131, 141, 0.15);
      animation: floatEnvelope 3s ease-in-out infinite;
    }

    .envelope-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: pulseHeart 2s infinite;
    }

    /* Match Modal / Screen Style */
    .match-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(43, 45, 66, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .match-modal {
      background: linear-gradient(135deg, #2b2d42, #1a1b26);
      color: white;
      padding: 45px 35px;
      border-radius: 24px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      border: 2px solid var(--palo-rosa);
      animation: floatEnvelope 4s ease-in-out infinite;
    }

    .match-modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--palo-rosa-pale);
      margin: 0 0 10px 0;
    }

    .couple-circles {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 25px 0;
    }

    .couple-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--palo-rosa);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      border: 3px solid white;
      box-shadow: 0 5px 20px rgba(181, 131, 141, 0.4);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [user, setUser] = React.useState(null);
      const [usernameInput, setUsernameInput] = React.useState('');
      const [passwordInput, setPasswordInput] = React.useState('');
      const [showPassword, setShowPassword] = React.useState(false);
      const [loginError, setLoginError] = React.useState('');

      const [activeTab, setActiveTab] = React.useState('wishlist');
      const [data, setData] = React.useState({ wishlist: [], freeDays: [], proposals: [], matches: [], connection: { status: 'connected' }, nicknames: {} });

      // Form states
      const [newTitle, setNewTitle] = React.useState('');
      const [newDesc, setNewDesc] = React.useState('');
      const [newCategory, setNewCategory] = React.useState('Restaurante');
      const [selectedDate, setSelectedDate] = React.useState('');
      const [proposalPlace, setProposalPlace] = React.useState('');
      const [proposalDate, setProposalDate] = React.useState('');
      const [proposalMessage, setProposalMessage] = React.useState('');
      const [myNickname, setMyNickname] = React.useState('');
      const [showMatchModal, setShowMatchModal] = React.useState(false);
      const [latestMatch, setLatestMatch] = React.useState(null);

      const partnerName = user?.name === 'Michael Milla' ? 'Mirella Garcia' : 'Michael Milla';
      const myNick = user ? (data.nicknames?.[user.name] || user.name) : '';
      const partnerNick = data.nicknames?.[partnerName] || partnerName;

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
          });
          const json = await res.json();
          if (json.success) {
            setUser({ username: json.username, name: json.name });
            setMyNickname(json.name === 'Michael Milla' ? 'Mi Amor' : 'Mi Vida');
          } else {
            setLoginError(json.error || 'Credenciales inválidas');
          }
        } catch (err) {
          setLoginError('Error al conectar con el servidor');
        }
      };

      const fetchData = async () => {
        try {
          const res = await fetch('/api/data');
          const json = await res.json();
          setData(json);
        } catch (e) {
          console.error("Error cargando datos", e);
        }
      };

      React.useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 3000);
        return () => clearInterval(interval);
      }, []);

      if (!user) {
        return (
          <div className="browser-frame">
            <div className="browser-toolbar">
              <div className="browser-dots">
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
              </div>
            </div>
            <div className="hero-section" style={{padding: '60px 20px'}}>
              <div className="hero-brand">NUESTROS MOMENTOS</div>
              <div className="hero-content">
                <h1>Nuestros Momentos</h1>
                <p>Inicia sesión para planear tus citas con elegancia</p>
                <div className="hero-badge">CONEXIÓN DE NOVIOS ❤️</div>
              </div>
            </div>
            <div className="content-container">
              <div className="login-container" style={{margin: '20px auto 50px auto'}}>
                <h2>Acceso Exclusivo</h2>
                <p>Ingresa tus credenciales para comenzar</p>
                <form onSubmit={handleLogin}>
                  <input type="text" placeholder="Usuario (ej. mmilla o mgarcia)" value={usernameInput} onChange={e => setUsernameInput(e.target.value)} required />
                  <div style={{position: 'relative', display: 'flex', alignItems: 'center'}}>
                    <input type={showPassword ? "text" : "password"} placeholder="Contraseña" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} required style={{paddingRight: '45px'}} />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} style={{position: 'absolute', right: '12px', top: '38%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.1rem'}}>
                      {showPassword ? '👁️‍🗨️' : '👁️'}
                    </button>
                  </div>
                  <button className="action-btn" type="submit" style={{marginTop: '10px'}}>Entrar con Amor ❤️</button>
                  {loginError && <div className="error-msg">{loginError}</div>}
                </form>
              </div>
            </div>
          </div>
        );
      }

      const addWishlistItem = async (e) => {
        e.preventDefault();
        if (!newTitle) return;
        const iconMap = { 'Restaurante': '🍝', 'Viaje': '🌊', 'Café': '☕', 'Paseo': '🌸' };
        await fetch('/api/wishlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle, description: newDesc, category: newCategory, image: iconMap[newCategory] || '❤️', addedBy: myNick })
        });
        setNewTitle('');
        setNewDesc('');
        fetchData();
      };

      const deleteWishlistItem = async (id) => {
        if (!confirm('¿Estás seguro de eliminar este lugar de la wishlist?')) return;
        try {
          const res = await fetch(`/api/wishlist/${id}`, { method: 'DELETE' });
          const json = await res.json();
          if (json.success) {
            setData(prev => ({ ...prev, wishlist: json.wishlist }));
          } else {
            fetchData();
          }
        } catch (e) {
          console.error("Error al eliminar wishlist", e);
          fetchData();
        }
      };

      const markFreeDay = async (e) => {
        e.preventDefault();
        if (!selectedDate) return;
        await fetch('/api/freedays', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: myNick, date: selectedDate })
        });
        setSelectedDate('');
        fetchData();
      };

      const sendProposal = async (e) => {
        e.preventDefault();
        if (!proposalPlace || !proposalDate) return;
        await fetch('/api/proposals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: myNick, receiver: partnerName, place: proposalPlace, date: proposalDate, message: proposalMessage })
        });
        setProposalPlace('');
        setProposalDate('');
        setProposalMessage('');
        setActiveTab('proposals');
        fetchData();
      };

      const respondProposal = async (id, action) => {
        const res = await fetch(`/api/proposals/${id}/respond`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
        const json = await res.json();
        if (action === 'accept') {
          setLatestMatch(json);
          setShowMatchModal(true);
        }
        fetchData();
      };

      const deleteMatch = async (id) => {
        if (!confirm('¿Estás seguro de que deseas eliminar esta cita oficial?')) return;
        try {
          const res = await fetch(`/api/matches/${id}`, { method: 'DELETE' });
          const json = await res.json();
          if (json.success) {
            setData(prev => ({ ...prev, matches: json.matches }));
          } else {
            fetchData();
          }
        } catch (e) {
          console.error("Error al eliminar match", e);
          fetchData();
        }
      };

      const updateNickname = async (e) => {
        e.preventDefault();
        await fetch('/api/nicknames', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: user.name, nickname: myNickname })
        });
        alert('¡Apodo cariñoso actualizado con éxito! ❤️');
        fetchData();
      };

      const disconnectCouple = async () => {
        if (!confirm('¿Estás seguro de que deseas disolver el match de novios? Ambos podrán volver a vincularse cuando lo deseen.')) return;
        await fetch('/api/connection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'disconnect' })
        });
        alert('Se ha desvinculado la conexión de novios.');
        fetchData();
      };

      const myProposals = data.proposals.filter(p => p.receiver === user.name && p.status === 'pending');

      return (
        <div className="browser-frame">
          {showMatchModal && (
            <div className="match-modal-overlay">
              <div className="match-modal">
                <div style={{fontSize: '3rem', marginBottom: '10px'}}>💖</div>
                <h2>¡It's a Match!</h2>
                <p style={{color: '#f4acb7', fontSize: '1.05rem', fontStyle: 'italic'}}>¡Has aceptado la propuesta de {partnerNick}!</p>
                <div className="couple-circles">
                  <div className="couple-circle">👩‍❤️‍👨</div>
                </div>
                <p style={{fontSize: '0.9rem', color: '#d1d5db', marginBottom: '25px'}}>Su cita en <strong>{latestMatch?.place}</strong> para el <strong>{latestMatch?.date}</strong> ha sido oficializada con éxito.</p>
                <button className="action-btn" style={{background: 'var(--palo-rosa)'}} onClick={() => { setShowMatchModal(false); setActiveTab('matches'); }}>
                  Ver Cita Confirmada ✨
                </button>
              </div>
            </div>
          )}

          <div className="browser-toolbar">
            <div className="browser-dots">
              <div className="dot"></div>
              <div className="dot"></div>
              <div className="dot"></div>
            </div>
          </div>

          <div className="hero-section">
            <div className="hero-brand">NUESTROS MOMENTOS</div>
            <div className="hero-content">
              <h1>{myNick} & {partnerNick}</h1>
              <p>Conexión oficial de novios y planificación en pareja</p>
              <div className="hero-badge">AMOR VERDADERO ❤️</div>
            </div>
          </div>

          <div className="content-container">
            <div className="user-banner">
              <span>👤 Conectado como: <strong>{myNick}</strong> ({user.name})</span>
              <button className="logout-btn" onClick={() => setUser(null)}>Cerrar Sesión</button>
            </div>

            <div className="stats-bar">
              <div className="stat-card">
                <h4>{data.wishlist.length}</h4>
                <span>Wishlist</span>
              </div>
              <div className="stat-card">
                <h4>{data.freeDays.length}</h4>
                <span>Días Libres</span>
              </div>
              <div className="stat-card">
                <h4>{data.matches.length}</h4>
                <span>Citas Match</span>
              </div>
            </div>

            <div className="tabs">
              <button className={`tab-btn ${activeTab === 'connection' ? 'active' : ''}`} onClick={() => setActiveTab('connection')}>💍 Conexión Novios</button>
              <button className={`tab-btn ${activeTab === 'wishlist' ? 'active' : ''}`} onClick={() => setActiveTab('wishlist')}>✨ Wishlist</button>
              <button className={`tab-btn ${activeTab === 'freedays' ? 'active' : ''}`} onClick={() => setActiveTab('freedays')}>📅 Días Libres</button>
              <button className={`tab-btn ${activeTab === 'propose' ? 'active' : ''}`} onClick={() => setActiveTab('propose')}>💌 Proponer Cita</button>
              <button className={`tab-btn ${activeTab === 'proposals' ? 'active' : ''}`} onClick={() => setActiveTab('proposals')}>
                📬 Cartitas {myProposals.length > 0 && <span style={{background: 'var(--palo-rosa)', color: 'white', padding: '2px 6px', borderRadius: '10px', fontSize: '0.7rem', marginLeft: '6px'}}>{myProposals.length}</span>}
              </button>
              <button className={`tab-btn ${activeTab === 'matches' ? 'active' : ''}`} onClick={() => setActiveTab('matches')}>❤️ Citas Match</button>
            </div>

            {activeTab === 'connection' && (
              <div className="card">
                <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>💍 Conexión de Novios y Apodos Cariñosos</h3>
                <p style={{color: 'var(--text-muted)', fontSize: '0.92rem'}}>Vincula tu cuenta con tu pareja y personaliza vuestros apodos para reflejar vuestro amor.</p>
                
                <form onSubmit={updateNickname} style={{marginTop: '25px', background: '#fcfafb', padding: '20px', borderRadius: '12px', border: '1px solid var(--border-color)'}}>
                  <label>Tu Apodo Cariñoso:</label>
                  <input type="text" value={myNickname} onChange={e => setMyNickname(e.target.value)} placeholder="Ej. Mi Amor, Príncipe, Princesa..." required />
                  <button className="action-btn" type="submit">Guardar Mi Apodo ❤️</button>
                </form>

                <div style={{marginTop: '30px', textAlign: 'center', background: 'linear-gradient(135deg, #fff0f3, #ffe5ec)', padding: '25px', borderRadius: '16px', border: '1px solid var(--palo-rosa-light)'}}>
                  <div style={{fontSize: '2.5rem', marginBottom: '10px'}}>👩‍❤️‍👨</div>
                  <h4 style={{fontFamily: 'Playfair Display', fontSize: '1.4rem', color: 'var(--palo-rosa-dark)', margin: '0 0 10px 0'}}>Estado de Conexión</h4>
                  <p style={{fontSize: '1.05rem', margin: '5px 0'}}>Novios vinculados: <strong>{myNick}</strong> & <strong>{partnerNick}</strong> ✨</p>
                  <span className="badge" style={{marginTop: '10px', background: 'var(--palo-rosa)', color: 'white'}}>Match de Novios Activo ❤️</span>
                  <div style={{marginTop: '20px'}}>
                    <button className="action-btn delete-btn" style={{width: 'auto', display: 'inline-block', padding: '8px 20px'}} onClick={disconnectCouple}>
                      Romper / Borrar Match de Novios 💔
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'wishlist' && (
              <div>
                <div className="card">
                  <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>✨ Agregar Nuevo Lugar a la Wishlist</h3>
                  <form onSubmit={addWishlistItem}>
                    <label>Título del lugar o actividad</label>
                    <input type="text" placeholder="Ej. Cena Romántica / Café en el parque" value={newTitle} onChange={e => setNewTitle(e.target.value)} required />
                    
                    <label>Descripción</label>
                    <textarea placeholder="Detalles o notas especiales..." value={newDesc} onChange={e => setNewDesc(e.target.value)} rows="3"></textarea>
                    
                    <label>Categoría</label>
                    <select value={newCategory} onChange={e => setNewCategory(e.target.value)}>
                      <option value="Restaurante">Restaurante 🍝</option>
                      <option value="Viaje">Viaje 🌊</option>
                      <option value="Café">Café ☕</option>
                      <option value="Paseo">Paseo 🌸</option>
                    </select>
                    <button className="action-btn" type="submit">Agregar a la Wishlist</button>
                  </form>
                </div>

                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.5rem', marginBottom: '20px', color: 'var(--text-main)'}}>Lugares Soñados</h2>
                <div className="grid">
                  {data.wishlist.map(item => (
                    <div className="wishlist-item" key={item.id}>
                      <div>
                        <div style={{fontSize: '2.5rem', marginBottom: '10px'}}>{item.image}</div>
                        <h3 style={{margin: '5px 0 8px 0', fontSize: '1.1rem', fontWeight: 600, fontFamily: 'Playfair Display'}}>{item.title}</h3>
                        <span className="badge">{item.category}</span>
                        <p style={{color: 'var(--text-muted)', fontSize: '0.9rem', margin: '10px 0'}}>{item.description}</p>
                        <p style={{fontSize: '0.75rem', color: '#b5838d', fontStyle: 'italic', margin: '0 0 15px 0'}}>Agregado por {item.addedBy}</p>
                      </div>
                      <div>
                        <button className="secondary-btn" onClick={() => { setProposalPlace(item.title); setActiveTab('propose'); }}>
                          Proponer esta cita 💌
                        </button>
                        <button className="action-btn delete-btn" onClick={() => deleteWishlistItem(item.id)}>
                          Eliminar 🗑️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'freedays' && (
              <div className="card">
                <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>📅 Sincroniza tus Días Libres</h3>
                <form onSubmit={markFreeDay}>
                  <label>Selecciona un día libre:</label>
                  <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} required />
                  <button className="action-btn" type="submit">Registrar Día Libre</button>
                </form>

                <h3 style={{marginTop: '30px', fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.2rem', color: 'var(--text-main)'}}>Disponibilidad en Pareja</h3>
                {data.freeDays.length === 0 ? (
                  <p style={{color: 'var(--text-muted)', fontStyle: 'italic'}}>Aún no hay días libres registrados.</p>
                ) : (
                  <ul style={{listStyle: 'none', padding: 0, marginTop: '15px'}}>
                    {data.freeDays.map((d, index) => (
                      <li key={index} style={{background: '#fcfafb', border: '1px solid var(--border-color)', padding: '12px 18px', borderRadius: '12px', marginBottom: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span>👤 <strong>{d.user}</strong> está libre</span>
                        <span className="badge">📅 {d.date}</span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            )}

            {activeTab === 'propose' && (
              <div className="card">
                <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>💌 Enviar Propuesta a tu Novio/a</h3>
                <form onSubmit={sendProposal}>
                  <label>Enviar a:</label>
                  <input type="text" value={`${partnerNick} (${partnerName})`} disabled style={{background: '#f3f4f6', cursor: 'not-allowed', fontWeight: '500'}} />

                  <label>Lugar o Actividad:</label>
                  <input type="text" placeholder="Ej. Cena Romántica" value={proposalPlace} onChange={e => setProposalPlace(e.target.value)} required />
                  
                  <label>Fecha Propuesta:</label>
                  <input type="date" value={proposalDate} onChange={e => setProposalDate(e.target.value)} required />
                  
                  <label>Mensaje:</label>
                  <textarea placeholder="Escribe un mensaje especial..." value={proposalMessage} onChange={e => setProposalMessage(e.target.value)} rows="4" required></textarea>
                  
                  <button className="action-btn" type="submit">Enviar Propuesta 💌</button>
                </form>
              </div>
            )}

            {activeTab === 'proposals' && (
              <div>
                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.5rem', marginBottom: '20px', color: 'var(--text-main)'}}>📬 Propuestas y Cartitas</h2>
                {myProposals.length === 0 ? (
                  <div className="card" style={{textAlign: 'center', padding: '40px'}}>
                    <div style={{fontSize: '3rem', marginBottom: '10px'}}>💌</div>
                    <p style={{color: 'var(--text-muted)'}}>No tienes cartitas pendientes por revisar en este momento.</p>
                  </div>
                ) : (
                  myProposals.map(prop => (
                    <div className="envelope-card" key={prop.id}>
                      <div className="envelope-icon">💌</div>
                      <h3 style={{marginTop: 0, fontWeight: 600, fontFamily: 'Playfair Display', color: 'var(--palo-rosa-dark)'}}>¡Te ha llegado una cartita de {prop.sender}!</h3>
                      <p><strong>Lugar:</strong> {prop.place}</p>
                      <p><strong>Fecha:</strong> {prop.date}</p>
                      <p style={{background: 'rgba(255,255,255,0.85)', padding: '15px', borderRadius: '12px', border: '1px solid var(--border-color)', fontStyle: 'italic'}}>"{prop.message}"</p>
                      <div style={{display: 'flex', gap: '12px', marginTop: '20px'}}>
                        <button className="action-btn" style={{background: '#10b981', margin: 0}} onClick={() => respondProposal(prop.id, 'accept')}>Aceptar ❤️</button>
                        <button className="secondary-btn delete-btn" style={{margin: 0}} onClick={() => respondProposal(prop.id, 'reject')}>Rechazar</button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'matches' && (
              <div>
                <h2 style={{fontWeight: 600, fontFamily: 'Playfair Display', fontSize: '1.5rem', marginBottom: '20px', color: 'var(--text-main)'}}>❤️ Citas Confirmadas</h2>
                {data.matches.length === 0 ? (
                  <div className="card" style={{textAlign: 'center', padding: '40px'}}>
                    <p style={{color: 'var(--text-muted)'}}>Aún no hay citas confirmadas.</p>
                  </div>
                ) : (
                  <div className="grid">
                    {data.matches.map(m => (
                      <div className="card" key={m.id} style={{display: 'flex', flexDirection: 'column', justifyContent: 'space-between'}}>
                        <div>
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px'}}>
                            <span className="badge" style={{margin: 0}}>Confirmada ✨</span>
                            <span style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>{m.sender}</span>
                          </div>
                          <h3 style={{margin: '8px 0', fontSize: '1.1rem', fontWeight: 600, fontFamily: 'Playfair Display'}}>{m.place}</h3>
                          <p style={{margin: '4px 0', color: 'var(--text-muted)', fontSize: '0.9rem'}}>📅 {m.date}</p>
                          {m.message && <p style={{background: '#fcfafb', padding: '10px', borderRadius: '8px', fontSize: '0.85rem', fontStyle: 'italic', margin: '10px 0'}}>"{m.message}"</p>}
                        </div>
                        <button className="action-btn delete-btn" onClick={() => deleteMatch(m.id)}>
                          Eliminar Cita 🗑️
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
